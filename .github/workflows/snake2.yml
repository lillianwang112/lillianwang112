name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        run: |
          # Use the Platane/snk docker image to avoid Node.js version issues
          mkdir -p dist
          docker run --rm \
            -e GITHUB_USER_NAME=lillianwang112 \
            -v ${{ github.workspace }}/dist:/dist \
            ghcr.io/platane/snk:v3 \
              --userName lillianwang112 \
              --outputPath /dist/github-snake.svg \
              --palette "github-light" || true

          # Generate dark variant
          docker run --rm \
            -e GITHUB_USER_NAME=lillianwang112 \
            -v ${{ github.workspace }}/dist:/dist \
            ghcr.io/platane/snk:v3 \
              --userName lillianwang112 \
              --outputPath /dist/github-snake-dark.svg \
              --palette "github-dark" || true

      - name: Check output
        run: ls -la dist/

      - name: Push to output branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update snake animation"
          git branch -M output
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin output
